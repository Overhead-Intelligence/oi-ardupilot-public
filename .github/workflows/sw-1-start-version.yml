name: "SW 1. Start version"

# Starts the next version (run it on development): cuts the version branch vX.Y and sets VERSION
# to X.Y.0 there. Nothing is tagged until the version is stable and released with SW 2 and SW 3.
# The release tools live in Overhead-Intelligence/.github-private (sw/README.md); this file only
# calls them.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "auto = next minor version; major = next major version"
        type: choice
        options: [auto, major]
        default: auto
      version:
        description: "Or an exact new version X.Y.0 (optional)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  sw:
    uses: Overhead-Intelligence/.github-private/.github/workflows/sw-start-version.yml@main
    with:
      bump: ${{ inputs.bump }}
      version: ${{ inputs.version }}
    secrets: inherit

name: "SW 2. Prepare release"

# Prepares the release of the version branch vX.Y selected in "Use workflow from", once it is
# stable: opens the release pull request (CHANGELOG section dated, VERSION and its mirrors). The
# release tools live in Overhead-Intelligence/.github-private (sw/README.md); this file only calls
# them.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sw:
    uses: Overhead-Intelligence/.github-private/.github/workflows/sw-prepare-release.yml@main
    secrets: inherit
